<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>卓ポータル - Session Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            touch-action: manipulation;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior-y: none; /* スマホ特有のバウンスを抑制 */
        }
        /* プルリフレッシュ用インジケーターの初期状態 */
        #pullRefreshIndicator {
            transform: translateY(-100%);
            transition: transform 0.2s cubic-bezier(0, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 flex flex-col justify-between font-sans selection:bg-stone-300 relative">

    <!-- 🌟 引き下げたら更新（Pull-to-Refresh）用インジケーター -->
    <div id="pullRefreshIndicator" class="absolute top-4 left-0 right-0 flex items-center justify-center z-50 pointer-events-none">
        <div class="bg-white/90 backdrop-blur-md px-4 py-2 rounded-full shadow-md border border-stone-200 text-stone-600 text-xs font-bold flex items-center gap-2">
            <i id="refreshIcon" class="fa-solid fa-rotate-right transition-transform duration-200"></i>
            <span id="refreshText">下に引っ張って更新</span>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-stone-200 flex-shrink-0">
        <div class="max-w-md mx-auto px-4 h-12 flex items-center justify-between">
            <h1 class="text-xs font-bold tracking-wider text-stone-700 flex items-center gap-2">
                <i class="fa-solid fa-compass text-stone-500"></i>
                Session Portal
            </h1>
            <span class="text-[10px] text-stone-400 font-medium">卓管理・アーカイブ</span>
        </div>
    </header>

    <!-- メインコンテンツ（中央配置・スクロールなし） -->
    <main class="max-w-sm w-full mx-auto px-4 flex flex-col items-center justify-center gap-5 my-auto">
        
        <!-- タイトルまたはアイコン -->
        <div class="text-center flex flex-col items-center gap-2">
            <div class="w-14 h-14 rounded-full bg-white border border-stone-200 shadow-sm flex items-center justify-center text-stone-700">
                <i class="fa-solid fa-book-bookmark text-xl text-stone-600"></i>
            </div>
            <h2 class="text-sm font-bold text-stone-800 tracking-tight">卓ポータル</h2>
        </div>

        <!-- リンクカード群 -->
        <div class="w-full flex flex-col gap-3">
            
            <!-- キャラクター一覧へ -->
            <a href="characters.html" class="group flex items-center justify-between px-4 py-3.5 bg-white hover:bg-stone-50 border border-stone-200 rounded-2xl shadow-sm transition-all">
                <div class="flex items-center gap-3 min-w-0">
                    <!-- 🌟 アイコン枠（p-1.5 でほどよい余白、localStorageの画像があれば表示、無ければフォールバック） -->
                    <div class="w-9 h-9 rounded-xl bg-stone-100 border border-stone-200 flex items-center justify-center text-stone-700 group-hover:bg-stone-800 group-hover:text-white transition-colors flex-shrink-0 overflow-hidden relative p-1.5">
                        <img id="charIconImg" src="" alt="" class="w-full h-full object-contain" style="display:none;" onerror="this.style.display='none'; document.getElementById('charDefaultIcon').style.display='flex';">
                        <i id="charDefaultIcon" class="fa-solid fa-users text-sm"></i>
                    </div>
                    <span class="text-xs font-bold text-stone-800 truncate">キャラクター一覧</span>
                </div>
                <div class="text-stone-400 group-hover:text-stone-600 transition-colors pr-1 flex-shrink-0">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

            <!-- 日記・アルバムへ -->
            <a href="diary.html" class="group flex items-center justify-between px-4 py-3.5 bg-white hover:bg-stone-50 border border-stone-200 rounded-2xl shadow-sm transition-all">
                <div class="flex items-center gap-3 min-w-0">
                    <!-- 🌟 アイコン枠（p-1.5 でほどよい余白、localStorageの画像があれば表示、無ければフォールバック） -->
                    <div class="w-9 h-9 rounded-xl bg-stone-100 border border-stone-200 flex items-center justify-center text-stone-700 group-hover:bg-stone-800 group-hover:text-white transition-colors flex-shrink-0 overflow-hidden relative p-1.5">
                        <img id="diaryIconImg" src="" alt="" class="w-full h-full object-contain" style="display:none;" onerror="this.style.display='none'; document.getElementById('diaryDefaultIcon').style.display='flex';">
                        <i id="diaryDefaultIcon" class="fa-solid fa-book-open text-sm"></i>
                    </div>
                    <span class="text-xs font-bold text-stone-800 truncate">月別アルバム・日記</span>
                </div>
                <div class="text-stone-400 group-hover:text-stone-600 transition-colors pr-1 flex-shrink-0">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </a>

        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full py-4 text-center border-t border-stone-200/60 bg-white/40 flex-shrink-0">
        <p class="text-[10px] text-stone-400 font-medium">Session & Character Management System</p>
    </footer>

    <!-- 🌟 アイコン動的読み込み ＆ プルリフレッシュ制御スクリプト -->
    <script>
        // ページ読み込み時にlocalStorageから各ページのカスタムアイコンを反映
        window.addEventListener('DOMContentLoaded', () => {
            // 1. キャラクター一覧のアイコン反映
            const charFavicon = localStorage.getItem('characterFavicon');
            if (charFavicon) {
                const img = document.getElementById('charIconImg');
                img.src = charFavicon;
                img.style.display = 'block';
                const defaultIcon = document.getElementById('charDefaultIcon');
                if (defaultIcon) defaultIcon.style.display = 'none';
            }

            // 2. 日記・アルバムのアイコン反映（cachedSiteConfig から logoImageUrl を取得）
            const cachedConfigStr = localStorage.getItem('cachedSiteConfig');
            if (cachedConfigStr) {
                try {
                    const diaryConfig = JSON.parse(cachedConfigStr);
                    if (diaryConfig && diaryConfig.logoImageUrl) {
                        const img = document.getElementById('diaryIconImg');
                        img.src = diaryConfig.logoImageUrl;
                        img.style.display = 'block';
                        const defaultIcon = document.getElementById('diaryDefaultIcon');
                        if (defaultIcon) defaultIcon.style.display = 'none';
                    }
                } catch (e) {
                    console.error("Diary config parse error:", e);
                }
            }
        });

        let touchStartY = 0;
        let isPulling = false;
        const pullThreshold = 70;
        
        const indicator = document.getElementById('pullRefreshIndicator');
        const refreshIcon = document.getElementById('refreshIcon');
        const refreshText = document.getElementById('refreshText');

        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            isPulling = true;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - touchStartY;

            if (diff > 0) {
                const pullDist = Math.min(diff * 0.4, 90);
                indicator.style.transform = `translateY(${pullDist}px)`;

                if (diff > pullThreshold) {
                    refreshText.textContent = '指を離して更新';
                    refreshIcon.style.transform = 'rotate(180deg)';
                } else {
                    refreshText.textContent = '下に引っ張って更新';
                    refreshIcon.style.transform = 'rotate(0deg)';
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isPulling) return;
            isPulling = false;

            const currentY = e.changedTouches[0].clientY;
            const diff = currentY - touchStartY;

            if (diff > pullThreshold) {
                indicator.style.transform = `translateY(60px)`;
                refreshText.textContent = '更新中...';
                refreshIcon.className = 'fa-solid fa-spinner fa-spin text-stone-700';
                
                setTimeout(() => {
                    window.location.reload();
                }, 400);
            } else {
                indicator.style.transform = `translateY(-100%)`;
            }
            touchStartY = 0;
        });
    </script>
</body>
</html>
