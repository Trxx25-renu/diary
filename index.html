<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卓ポータル</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }
        .glass-button:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.35);
        }
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #2a2a2a;
        }
    </style>
</head>
<body class="relative min-h-screen text-white overflow-hidden flex flex-col justify-between">

    <!-- 背景画像レイヤー -->
    <div id="bgLayer" class="absolute inset-0 bg-cover bg-center z-0 transition-all duration-500">
        <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <!-- 引っ張り更新インジケーター -->
    <div id="pullRefreshIndicator" class="absolute top-0 left-0 right-0 h-16 flex items-center justify-center space-x-2 text-sm z-30 transform -translate-y-full transition-transform duration-200 pointer-events-none">
        <svg id="refreshIcon" class="w-5 h-5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        <span id="refreshText">下に引っ張って更新</span>
    </div>

    <!-- メインコンテナ -->
    <div id="mainContainer" class="relative z-10 flex-1 overflow-y-auto flex flex-col items-center justify-between p-6 max-w-md mx-auto w-full">
        
        <!-- 上部：管理者設定ボタン -->
        <div class="w-full flex justify-between items-center pt-2">
            <span id="portalTitleHeader" class="text-xs tracking-widest uppercase text-white/80 font-semibold drop-shadow">SESSION PORTAL</span>
            <button onclick="openEditModal()" class="glass-button p-2.5 rounded-full text-white shadow-lg flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>

        <!-- 状態復帰バー -->
        <div id="restoreContainer" class="w-full my-2 hidden">
            <div class="glass-panel rounded-xl p-3 flex items-center justify-between shadow-lg">
                <span id="restoreText" class="text-xs text-white/90">前回のページを開きますか？</span>
                <button id="restoreBtn" class="bg-white/30 hover:bg-white/40 text-xs px-3 py-1.5 rounded-lg font-medium transition">復元する</button>
            </div>
        </div>

        <!-- 中央：アイコン＆タイトル -->
        <div class="flex flex-col items-center my-auto py-8">
            <div class="w-32 h-32 rounded-full glass-panel flex items-center justify-center overflow-hidden mb-6 shadow-2xl p-1">
                <img id="mainIconImg" src="" alt="Portal Icon" class="w-full h-full object-cover rounded-full">
            </div>
            <h1 id="portalTitleDisplay" class="text-2xl font-bold tracking-wider text-center drop-shadow-md">卓ポータル</h1>
        </div>

        <!-- 下部：ナビゲーションリンク群 -->
        <div class="w-full space-y-3 pb-8">
            <a href="characters.html" onclick="recordPage('characters.html')" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-between shadow-lg font-semibold text-base">
                <span id="nameCharDisplay">キャラクター一覧</span>
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
            <a href="diary.html" onclick="recordPage('diary.html')" class="glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-between shadow-lg font-semibold text-base">
                <span id="nameDiaryDisplay">月別アルバム・日記</span>
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <!-- 動的カスタムリンク挿入エリア -->
            <div id="customLinksContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- 管理者設定モーダル -->
    <div id="editModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 max-h-[90vh] overflow-y-auto space-y-4 text-white">
            <div class="flex justify-between items-center pb-2 border-b border-white/20">
                <h3 class="text-lg font-bold">ポータル設定</h3>
                <button onclick="closeEditModal()" class="p-1 rounded-full hover:bg-white/10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="authSection" class="space-y-3">
                <p class="text-xs text-white/80">設定を変更するには管理パスコードを入力してください。</p>
                <input type="password" id="inputAuthPass" placeholder="パスコード" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-white">
                <button onclick="verifyAdminPass()" class="w-full bg-white/20 hover:bg-white/30 py-3 rounded-xl font-semibold transition">認証する</button>
            </div>

            <div id="settingsFormSection" class="space-y-4 hidden">
                <div>
                    <label class="text-xs text-white/80 block mb-1">ポータルタイトル</label>
                    <input type="text" id="inputPortalTitle" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-white/80 block mb-1">新しい管理パスコード</label>
                    <input type="password" id="inputAdminPass" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2 text-sm focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-white/80 block mb-1">キャラ一覧の名称</label>
                        <input type="text" id="inputNameChar" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-white/80 block mb-1">日記の名称</label>
                        <input type="text" id="inputNameDiary" class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-2 text-sm focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-white/80 block mb-1">メインアイコン画像</label>
                    <input type="file" id="inputMainIconFile" accept="image/*" class="w-full text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-white/20 file:text-white hover:file:bg-white/30">
                </div>
                <div>
                    <label class="text-xs text-white/80 block mb-1">背景画像</label>
                    <input type="file" id="inputBgImageFile" accept="image/*" class="w-full text-xs text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-white/20 file:text-white hover:file:bg-white/30">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-white/80">カスタムリンク</label>
                        <button onclick="addCustomLinkRow('', '')" class="text-xs bg-white/20 px-2.5 py-1 rounded-lg">+ 追加</button>
                    </div>
                    <div id="modalCustomLinksList" class="space-y-2 max-h-40 overflow-y-auto"></div>
                </div>

                <button onclick="savePortalSettings()" class="w-full bg-white/30 hover:bg-white/40 py-3 rounded-xl font-semibold transition shadow-lg">保存する</button>
            </div>
        </div>
    </div>

    <script>
        let currentConfig = {
            portalTitle: "卓ポータル",
            adminPasscode: "1234",
            nameChar: "キャラクター一覧",
            nameDiary: "月別アルバム・日記",
            mainIconData: "",
            bgImageData: "",
            customLinks: []
        };

        const defaultIconSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        function recordPage(pageName) {
            sessionStorage.setItem('lastActivePage', pageName);
            sessionStorage.setItem('lastActiveTime', Date.now().toString());
        }

        function checkLastActivePage() {
            const lastPage = sessionStorage.getItem('lastActivePage');
            const lastTime = sessionStorage.getItem('lastActiveTime');
            if (lastPage && lastTime && (Date.now() - parseInt(lastTime) < 30 * 60 * 1000)) {
                const restoreContainer = document.getElementById('restoreContainer');
                const restoreText = document.getElementById('restoreText');
                const restoreBtn = document.getElementById('restoreBtn');
                
                let pageDisplayName = lastPage === 'characters.html' ? currentConfig.nameChar : 
                                      lastPage === 'diary.html' ? currentConfig.nameDiary : lastPage;
                
                restoreText.textContent = `直近で開いていた「${pageDisplayName}」に戻りますか？`;
                restoreContainer.classList.remove('hidden');

                restoreBtn.onclick = () => {
                    window.location.href = lastPage;
                };
            }
        }

        function loadSettings() {
            const saved = localStorage.getItem('portalConfig');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    currentConfig = { ...currentConfig, ...parsed };
                } catch(e) {}
            }
            applySettings();
            checkLastActivePage();
        }

        function saveSettingsToLocalStorage() {
            localStorage.setItem('portalConfig', JSON.stringify(currentConfig));
        }

        function applySettings() {
            document.getElementById('portalTitleHeader').textContent = currentConfig.portalTitle || "卓ポータル";
            document.getElementById('portalTitleDisplay').textContent = currentConfig.portalTitle || "卓ポータル";
            document.getElementById('nameCharDisplay').textContent = currentConfig.nameChar || "キャラクター一覧";
            document.getElementById('nameDiaryDisplay').textContent = currentConfig.nameDiary || "月別アルバム・日記";

            const iconImg = document.getElementById('mainIconImg');
            iconImg.src = currentConfig.mainIconData || defaultIconSvg;

            const bgLayer = document.getElementById('bgLayer');
            if (currentConfig.bgImageData) {
                bgLayer.style.backgroundImage = `url(${currentConfig.bgImageData})`;
            } else {
                bgLayer.style.backgroundImage = 'none';
            }

            const container = document.getElementById('customLinksContainer');
            container.innerHTML = '';
            if (currentConfig.customLinks && Array.isArray(currentConfig.customLinks)) {
                currentConfig.customLinks.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.className = 'glass-button w-full py-4 px-6 rounded-2xl flex items-center justify-between shadow-lg font-semibold text-base';
                    a.innerHTML = `<span>${link.name}</span><svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`;
                    container.appendChild(a);
                });
            }
        }

        function openEditModal() {
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('settingsFormSection').classList.add('hidden');
            document.getElementById('inputAuthPass').value = '';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function verifyAdminPass() {
            const pass = document.getElementById('inputAuthPass').value;
            if (pass === (currentConfig.adminPasscode || "1234")) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('settingsFormSection').classList.remove('hidden');
                
                document.getElementById('inputPortalTitle').value = currentConfig.portalTitle;
                document.getElementById('inputAdminPass').value = currentConfig.adminPasscode;
                document.getElementById('inputNameChar').value = currentConfig.nameChar;
                document.getElementById('inputNameDiary').value = currentConfig.nameDiary;
                
                const list = document.getElementById('modalCustomLinksList');
                list.innerHTML = '';
                if (currentConfig.customLinks) {
                    currentConfig.customLinks.forEach(l => addCustomLinkRow(l.name, l.url));
                }
            } else {
                alert('パスコードが違います');
            }
        }

        function addCustomLinkRow(name, url) {
            const list = document.getElementById('modalCustomLinksList');
            const div = document.createElement('div');
            div.className = 'flex space-x-2 items-center';
            div.innerHTML = `
                <input type="text" placeholder="リンク名" value="${name}" class="link-name flex-1 bg-black/30 border border-white/20 rounded-xl px-3 py-1.5 text-xs text-white">
                <input type="text" placeholder="URL" value="${url}" class="link-url flex-1 bg-black/30 border border-white/20 rounded-xl px-3 py-1.5 text-xs text-white">
                <button onclick="this.parentElement.remove()" class="text-red-300 hover:text-red-100 px-2 py-1 text-xs">✕</button>
            `;
            list.appendChild(div);
        }

        function getCustomLinksFromModal() {
            const rows = document.querySelectorAll('#modalCustomLinksList > div');
            let links = [];
            rows.forEach(r => {
                const name = r.querySelector('.link-name').value.trim();
                const url = r.querySelector('.link-url').value.trim();
                if (name && url) links.push({ name, url });
            });
            return links;
        }

        function compressImage(file, maxWidth) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function savePortalSettings() {
            currentConfig.portalTitle = document.getElementById('inputPortalTitle').value || "卓ポータル";
            currentConfig.adminPasscode = document.getElementById('inputAdminPass').value || "1234";
            currentConfig.nameChar = document.getElementById('inputNameChar').value || "キャラクター一覧";
            currentConfig.nameDiary = document.getElementById('inputNameDiary').value || "月別アルバム・日記";
            currentConfig.customLinks = getCustomLinksFromModal();

            const mainIconFile = document.getElementById('inputMainIconFile').files[0];
            if (mainIconFile) {
                try { currentConfig.mainIconData = await compressImage(mainIconFile, 600); } catch(e) {}
            }

            const bgImageFile = document.getElementById('inputBgImageFile').files[0];
            if (bgImageFile) {
                try { currentConfig.bgImageData = await compressImage(bgImageFile, 1000); } catch(e) {}
            }

            closeEditModal();
            applySettings();
            saveSettingsToLocalStorage();
        }

        let touchStartY = 0;
        let isPulling = false;
        const pullThreshold = 70;
        const indicator = document.getElementById('pullRefreshIndicator');
        const refreshIcon = document.getElementById('refreshIcon');
        const refreshText = document.getElementById('refreshText');
        const mainContainer = document.getElementById('mainContainer');

        window.addEventListener('touchstart', (e) => {
            if (mainContainer.scrollTop <= 0) {
                touchStartY = e.touches[0].clientY;
                isPulling = true;
            } else { isPulling = false; }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            const diff = e.touches[0].clientY - touchStartY;
            if (diff > 0 && mainContainer.scrollTop <= 0) {
                const pullDist = Math.min(diff * 0.4, 80);
                indicator.style.transform = `translateY(${pullDist}px)`;
                if (diff > pullThreshold) {
                    refreshText.textContent = '指を離して更新';
                    refreshIcon.style.transform = 'rotate(180deg)';
                } else {
                    refreshText.textContent = '下に引っ張って更新';
                    refreshIcon.style.transform = 'rotate(0deg)';
                }
            } else { indicator.style.transform = `translateY(0px)`; }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isPulling) return;
            isPulling = false;
            const diff = e.changedTouches[0].clientY - touchStartY;
            if (diff > pullThreshold && mainContainer.scrollTop <= 0) {
                refreshText.textContent = '更新中...';
                refreshIcon.classList.add('animate-spin');
                indicator.style.transform = `translateY(60px)`;
                setTimeout(() => { window.location.reload(); }, 300);
            } else { indicator.style.transform = `translateY(0px)`; }
            touchStartY = 0;
        });

        // 確実に読み込まれるようにする
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadSettings);
        } else {
            loadSettings();
        }
    </script>
</body>
</html>
