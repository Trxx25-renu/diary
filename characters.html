<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">キャラクター管理 | 卓日記</title>
    
    <!-- 動的ファビコン用 -->
    <link id="dynamicFavicon" rel="icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #292524;
        }
        .font-serif-title {
            font-family: 'Playfair Display', 'Noto Sans JP', serif;
        }
        input[type="text"], input[type="number"], input[type="password"], select, textarea {
            font-size: 16px !important;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.addEventListener("DOMContentLoaded", async () => {
            console.log("🚀 キャラクター管理ページ初期化開始...");

            try {
                if (sessionStorage.getItem('isAdminSession') === 'true') {
                    window.isAdmin = true;
                }
            } catch (e) { console.error(e); }

            window.appId = "photo-journal-app";

            const firebaseConfig = {
                apiKey: "AIzaSyA2ctX9sUpJmLSVJomU9cbMzrUX_AXNjuE",
                authDomain: "diary-36d77.firebaseapp.com",
                projectId: "diary-36d77",
                storageBucket: "diary-36d77.firebasestorage.app",
                messagingSenderId: "1060563209082",
                appId: "1:1060563209082:web:1c6cfc21a496548309e4c3",
                measurementId: "G-RBK7ZN6NF1"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            window.db = db;

            await signInAnonymously(auth);

            window.systems = [
                { id: 'coc', name: 'クトゥルフ神話TRPG', desc: 'CoC 6版 / 7版', badgeColor: 'bg-amber-900/80' },
                { id: 'sw25', name: 'ソード・ワールド2.5', desc: 'SW2.5 ルールブック', badgeColor: 'bg-emerald-800/80' },
                { id: 'insane', name: 'インセイン', desc: 'マルチジャンルホラーRPG', badgeColor: 'bg-purple-900/80' }
            ];

            try {
                const configRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'config', 'settings');
                const configSnap = await getDoc(configRef);
                if (configSnap.exists()) {
                    window.storedPasscode = configSnap.data().passcode;
                }

                const rosterConfigRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'config', 'characterRosterSettings');
                const rosterSnap = await getDoc(rosterConfigRef);
                if (rosterSnap.exists()) {
                    const data = rosterSnap.data();
                    window.rosterSettings = data;
                    applyRosterSettings(data);
                } else {
                    window.rosterSettings = { title: "キャラクター管理 | 卓日記", favicon: "" };
                }
            } catch (e) { console.error("Config load error:", e); }

            await loadCharactersFromFirestore();
            renderSystemFolders();
            updateAdminStateDisplay();
        });

        function applyRosterSettings(settings) {
            if (settings.title) {
                document.getElementById('pageTitle').textContent = settings.title;
            }
            if (settings.favicon) {
                document.getElementById('dynamicFavicon').href = settings.favicon;
            }
        }

        async function loadCharactersFromFirestore() {
            try {
                const charsRef = collection(db, 'artifacts', window.appId, 'public', 'data', 'characters');
                const querySnap = await getDocs(charsRef);
                const loaded = [];
                querySnap.forEach(d => {
                    loaded.push({ id: d.id, ...d.data() });
                });
                window.characters = loaded;
            } catch (e) {
                console.error("Characters load error:", e);
                window.characters = [];
            }
        }

        function renderSystemFolders(filterKeyword = "") {
            const container = document.getElementById('systemFoldersContainer');
            if (!container) return;

            container.innerHTML = '';
            const keyword = filterKeyword.toLowerCase().trim();

            window.systems.forEach(sys => {
                const sysChars = window.characters.filter(c => c.systemId === sys.id);
                const matchesSystem = sys.name.toLowerCase().includes(keyword) || sys.desc.toLowerCase().includes(keyword);
                const matchedChars = sysChars.filter(c => 
                    (c.name && c.name.toLowerCase().includes(keyword)) ||
                    (c.occupation && c.occupation.toLowerCase().includes(keyword))
                );

                if (keyword && !matchesSystem && matchedChars.length === 0) {
                    return;
                }

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 border border-stone-200/80 shadow-sm hover:border-stone-400 transition-all cursor-pointer flex flex-col justify-between gap-4 group';
                card.onclick = () => navigateTo('characterList', sys.id);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-medium text-white px-2.5 py-1 rounded-lg ${sys.badgeColor}">${sys.desc}</span>
                            <i class="fa-solid fa-folder-open text-stone-300 group-hover:text-stone-600 transition-colors"></i>
                        </div>
                        <h3 class="font-bold text-base text-stone-800 group-hover:text-stone-900">${sys.name}</h3>
                        <p class="text-xs text-stone-400 mt-1">登録キャラクター: <span class="font-bold text-stone-600">${sysChars.length}</span> 名</p>
                        ${keyword && matchedChars.length > 0 ? `<p class="text-[11px] text-amber-700 bg-amber-50 px-2 py-1 rounded-md mt-2">一致キャラ: ${matchedChars.map(c => c.name).join(', ')}</p>` : ''}
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-stone-100 text-xs text-stone-500 font-medium">
                        <span>一覧を見る</span>
                        <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform"></i>
                    </div>
                `;
                container.appendChild(card);
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-stone-400 text-xs">
                        <i class="fa-solid fa-search text-2xl mb-2"></i>
                        <p>一致するシステム・キャラクターが見つかりませんでした。</p>
                    </div>
                `;
            }
        }
        window.renderSystemFolders = renderSystemFolders;

        function handleFolderSearchInput(e) {
            renderSystemFolders(e.target.value);
        }
        window.handleFolderSearchInput = handleFolderSearchInput;

        function renderCharacterList(systemId, filterKeyword = "") {
            window.selectedSystemId = systemId;
            const sys = window.systems.find(s => s.id === systemId);
            const titleEl = document.getElementById('currentSystemTitle');
            if (titleEl && sys) titleEl.textContent = sys.name;

            const grid = document.getElementById('characterGrid');
            if (!grid) return;

            grid.innerHTML = '';
            const keyword = filterKeyword.toLowerCase().trim();
            const systemChars = window.characters.filter(c => c.systemId === systemId);
            
            const filteredChars = systemChars.filter(c => {
                if (!keyword) return true;
                const nameMatch = c.name && c.name.toLowerCase().includes(keyword);
                const occMatch = c.occupation && c.occupation.toLowerCase().includes(keyword);
                const ageMatch = c.age && String(c.age).includes(keyword);
                return nameMatch || occMatch || ageMatch;
            });

            if (filteredChars.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-stone-400 text-xs">
                        <i class="fa-solid fa-user-slash text-2xl mb-2"></i>
                        <p>${systemChars.length === 0 ? 'このシステムに登録されているキャラクターはまだいません。' : '条件に一致するキャラクターがいません。'}</p>
                    </div>
                `;
                return;
            }

            filteredChars.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 border border-stone-200/80 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col gap-3';
                card.onclick = () => navigateTo('detail', ch.id);

                let thumbHtml = `<div class="w-full h-full flex items-center justify-center text-stone-300 bg-stone-50"><i class="fa-solid fa-user text-3xl"></i></div>`;
                if (ch.thumbnail) {
                    thumbHtml = `<img src="${ch.thumbnail}" class="w-full h-full object-cover">`;
                }

                card.innerHTML = `
                    <div class="aspect-square w-full rounded-xl overflow-hidden relative border border-stone-100">
                        ${thumbHtml}
                    </div>
                    <div>
                        <h4 class="font-bold text-sm text-stone-800 truncate">${ch.name}</h4>
                        <p class="text-xs text-stone-400 mt-0.5 truncate">${ch.age ? ch.age + '歳' : ''} ${ch.occupation || ''}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        window.renderCharacterList = renderCharacterList;

        function handleCharacterSearchInput(e) {
            renderCharacterList(window.selectedSystemId, e.target.value);
        }
        window.handleCharacterSearchInput = handleCharacterSearchInput;

        function navigateTo(view, param = null) {
            const viewFolders = document.getElementById('view-folders');
            const viewList = document.getElementById('view-list');
            const viewDetail = document.getElementById('view-detail');
            const breadcrumbs = document.getElementById('breadcrumbs');

            if (viewFolders) viewFolders.classList.add('hidden');
            if (viewList) viewList.classList.add('hidden');
            if (viewDetail) viewDetail.classList.add('hidden');

            if (view === 'folders') {
                if (viewFolders) viewFolders.classList.remove('hidden');
                if (breadcrumbs) {
                    breadcrumbs.innerHTML = `<span class="text-stone-700 font-medium flex items-center gap-1"><i class="fa-solid fa-house text-[10px]"></i> システム一覧</span>`;
                }
                const searchInput = document.getElementById('folderSearchInput');
                if (searchInput) searchInput.value = '';
                renderSystemFolders();
            } else if (view === 'characterList') {
                if (viewList) viewList.classList.remove('hidden');
                const sys = window.systems.find(s => s.id === param);
                const sysName = sys ? sys.name : 'キャラクター一覧';
                if (breadcrumbs) {
                    breadcrumbs.innerHTML = `
                        <a href="javascript:void(0)" onclick="navigateTo('folders')" class="hover:text-stone-900 transition-colors flex items-center gap-1"><i class="fa-solid fa-house text-[10px]"></i> システム一覧</a>
                        <span class="text-stone-300">/</span>
                        <span class="text-stone-700 font-medium">${sysName}</span>
                    `;
                }
                const searchInput = document.getElementById('characterSearchInput');
                if (searchInput) searchInput.value = '';
                renderCharacterList(param);
            } else if (view === 'detail') {
                if (viewDetail) viewDetail.classList.remove('hidden');
                const ch = window.characters.find(c => c.id === param);
                const charName = ch ? ch.name : 'キャラクター詳細';
                if (breadcrumbs) {
                    breadcrumbs.innerHTML = `
                        <a href="javascript:void(0)" onclick="navigateTo('folders')" class="hover:text-stone-900 transition-colors flex items-center gap-1"><i class="fa-solid fa-house text-[10px]"></i> システム一覧</a>
                        <span class="text-stone-300">/</span>
                        <a href="javascript:void(0)" onclick="navigateTo('characterList', '${ch ? ch.systemId : window.selectedSystemId}')" class="hover:text-stone-900 transition-colors">${window.systems.find(s => s.id === (ch ? ch.systemId : window.selectedSystemId))?.name || '一覧'}</a>
                        <span class="text-stone-300">/</span>
                        <span class="text-stone-700 font-medium">${charName}</span>
                    `;
                }
                renderCharacterDetail(param);
            }
        }
        window.navigateTo = navigateTo;

        function renderCharacterDetail(characterId) {
            const detailContainer = document.getElementById('view-detail');
            if (!detailContainer) return;

            const ch = window.characters.find(c => c.id === characterId);
            if (!ch) {
                detailContainer.innerHTML = `<p class="text-xs text-stone-400 py-12 text-center">キャラクターが見つかりませんでした。</p>`;
                return;
            }

            let avatarHtml = `<div class="w-full h-64 sm:h-96 flex items-center justify-center text-stone-300 bg-stone-100 rounded-2xl"><i class="fa-solid fa-user text-5xl"></i></div>`;
            if (ch.avatar) {
                avatarHtml = `<img src="${ch.avatar}" class="w-full h-auto max-h-[500px] object-contain rounded-2xl bg-stone-900/5">`;
            }

            detailContainer.innerHTML = `
                <div class="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-6">
                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="w-full md:w-1/2">
                            ${avatarHtml}
                        </div>
                        <div class="w-full md:w-1/2 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-[10px] font-medium px-2.5 py-1 rounded-lg bg-stone-800 text-white">
                                        ${window.systems.find(s => s.id === ch.systemId)?.name || 'システム'}
                                    </span>
                                </div>
                                <h2 class="text-2xl font-bold text-stone-800 mb-4">${ch.name}</h2>
                                <div class="space-y-2 text-xs text-stone-600 border-t border-stone-100 pt-4">
                                    <p><strong class="text-stone-400 w-20 inline-block">年齢:</strong> ${ch.age ? ch.age + '歳' : '未設定'}</p>
                                    <p><strong class="text-stone-400 w-20 inline-block">職業/クラス:</strong> ${ch.occupation || '未設定'}</p>
                                </div>
                            </div>
                            <div class="pt-6 mt-6 border-t border-stone-100 flex items-center justify-between">
                                <button onclick="navigateTo('characterList', '${ch.systemId}')" class="text-xs font-medium text-stone-600 hover:text-stone-900 bg-stone-100 hover:bg-stone-200 px-4 py-2 rounded-xl transition-all flex items-center gap-1.5">
                                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                                    <span>一覧に戻る</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 🛡️ 権限チェック＆パスコードモーダル制御
        let pendingAction = null;

        function checkAdminPermission(callback) {
            if (window.isAdmin) {
                callback();
            } else {
                pendingAction = callback;
                openAuthModal();
            }
        }
        window.checkAdminPermission = checkAdminPermission;

        function openAuthModal() {
            const modal = document.getElementById('authModal');
            const input = document.getElementById('inputPasscode');
            const errorMsg = document.getElementById('authErrorMsg');
            if (input) input.value = '';
            if (errorMsg) errorMsg.classList.add('hidden');
            if (modal) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.querySelector('div > div').classList.remove('scale-95');
                if (input) input.focus();
            }
        }
        window.openAuthModal = openAuthModal;

        function closeAuthModal() {
            const modal = document.getElementById('authModal');
            if (modal) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.querySelector('div > div').classList.add('scale-95');
            }
            pendingAction = null;
        }
        window.closeAuthModal = closeAuthModal;

        function handleAuthSubmit(event) {
            event.preventDefault();
            const inputCode = document.getElementById('inputPasscode').value;
            const errorMsg = document.getElementById('authErrorMsg');

            if (inputCode === window.storedPasscode) {
                window.isAdmin = true;
                sessionStorage.setItem('isAdminSession', 'true');
                updateAdminStateDisplay();
                closeAuthModal();
                
                if (pendingAction) {
                    pendingAction();
                    pendingAction = null;
                }
            } else {
                if (errorMsg) errorMsg.classList.remove('hidden');
            }
        }
        window.handleAuthSubmit = handleAuthSubmit;

        function handleOpenAddModal() {
            checkAdminPermission(() => {
                const systemSelect = document.getElementById('charSystemSelect');
                if (systemSelect && window.selectedSystemId) {
                    systemSelect.value = window.selectedSystemId;
                }
                document.getElementById('characterModal').classList.remove('hidden');
            });
        }
        window.handleOpenAddModal = handleOpenAddModal;

        function closeCharacterModal() {
            document.getElementById('characterModal').classList.add('hidden');
            document.getElementById('characterForm').reset();
        }
        window.closeCharacterModal = closeCharacterModal;

        function handleOpenSettingsModal() {
            checkAdminPermission(() => {
                document.getElementById('settingTitleInput').value = window.rosterSettings?.title || "キャラクター管理 | 卓日記";
                
                const preview = document.getElementById('settingFaviconPreview');
                window.currentFaviconBase64 = window.rosterSettings?.favicon || "";
                if (window.currentFaviconBase64) {
                    preview.src = window.currentFaviconBase64;
                    preview.classList.remove('hidden');
                } else {
                    preview.classList.add('hidden');
                }

                document.getElementById('settingsModal').classList.remove('hidden');
            });
        }
        window.handleOpenSettingsModal = handleOpenSettingsModal;

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }
        window.closeSettingsModal = closeSettingsModal;

        function handleFaviconFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                window.currentFaviconBase64 = e.target.result;
                const preview = document.getElementById('settingFaviconPreview');
                preview.src = window.currentFaviconBase64;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        window.handleFaviconFileSelect = handleFaviconFileSelect;

        async function saveCharacter(event) {
            event.preventDefault();
            const systemId = document.getElementById('charSystemSelect').value;
            const name = document.getElementById('charName').value.trim();
            const age = document.getElementById('charAge').value;
            const occupation = document.getElementById('charOccupation').value.trim();
            const thumbnail = document.getElementById('charThumbnail').value.trim();
            const avatar = document.getElementById('charAvatar').value.trim();

            if (!name) { alert("キャラクター名は必須です。"); return; }

            const newCharData = {
                systemId, name,
                age: age ? Number(age) : '',
                occupation, thumbnail, avatar,
                createdAt: new Date().toISOString()
            };

            try {
                const charsRef = collection(db, 'artifacts', window.appId, 'public', 'data', 'characters');
                const docRef = await addDoc(charsRef, newCharData);
                window.characters.push({ id: docRef.id, ...newCharData });
                closeCharacterModal();
                renderCharacterList(systemId);
                renderSystemFolders();
                alert("キャラクターを登録しました！");
            } catch (e) {
                console.error("Save error:", e);
                alert("保存に失敗しました。");
            }
        }
        window.saveCharacter = saveCharacter;

        async function saveRosterSettings(event) {
            event.preventDefault();
            const title = document.getElementById('settingTitleInput').value.trim();
            const favicon = window.currentFaviconBase64 || window.rosterSettings?.favicon || "";

            const newSettings = { title, favicon };

            try {
                const rosterConfigRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'config', 'characterRosterSettings');
                await setDoc(rosterConfigRef, newSettings);
                
                window.rosterSettings = newSettings;
                applyRosterSettings(newSettings);
                closeSettingsModal();
                alert("サイト設定を保存しました！");
            } catch (e) {
                console.error("Settings save error:", e);
                alert("設定の保存に失敗しました。");
            }
        }
        window.saveRosterSettings = saveRosterSettings;

        function updateAdminStateDisplay() {
            const badge = document.getElementById('adminStateBadge');
            if (badge && window.isAdmin) badge.classList.remove('hidden');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200/80 px-4 py-3.5">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-1.5 text-xs text-stone-600 hover:text-stone-900 bg-stone-100 hover:bg-stone-200/70 px-3 py-1.5 rounded-xl transition-all">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>日記へ</span>
                </a>
                <h1 class="text-base font-bold font-serif-title text-stone-800 flex items-center gap-2">
                    <i class="fa-solid fa-users text-stone-600 text-xs"></i>
                    <span>Character Roster</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="adminStateBadge" class="hidden text-[10px] font-medium bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md">
                    管理者モード
                </span>
                <button onclick="handleOpenSettingsModal()" class="w-8 h-8 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 flex items-center justify-center transition-all" title="サイト設定">
                    <i class="fa-solid fa-gear text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto w-full p-4 flex-1">
        
        <nav id="breadcrumbs" class="flex items-center gap-2 text-xs text-stone-400 mb-6 overflow-x-auto whitespace-nowrap pb-1">
            <span class="text-stone-700 font-medium flex items-center gap-1">
                <i class="fa-solid fa-house text-[10px]"></i> システム一覧
            </span>
        </nav>

        <!-- 📂 システム別フォルダビュー -->
        <div id="view-folders">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                <div>
                    <h2 class="text-lg font-bold text-stone-800">システム選択</h2>
                    <p class="text-xs text-stone-400">管理したいTRPGシステムを選んでください</p>
                </div>
                <div class="relative w-full sm:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-stone-400 text-xs">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="folderSearchInput" oninput="handleFolderSearchInput(event)" placeholder="システムやキャラ名で検索..." class="w-full bg-white border border-stone-200 rounded-2xl pl-9 pr-4 py-2 text-xs text-stone-800 focus:outline-none focus:border-stone-400 shadow-sm">
                </div>
            </div>
            <div id="systemFoldersContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- 📂 キャラクター一覧ビュー -->
        <div id="view-list" class="hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                <div>
                    <h2 id="currentSystemTitle" class="text-lg font-bold text-stone-800">キャラクター一覧</h2>
                    <p class="text-xs text-stone-400">登録されている探索者・NPC</p>
                </div>
                <div class="flex items-center gap-2">
                    <div class="relative w-full sm:w-56">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-stone-400 text-xs">
                            <i class="fa-solid fa-search"></i>
                        </span>
                        <input type="text" id="characterSearchInput" oninput="handleCharacterSearchInput(event)" placeholder="このシステム内を検索..." class="w-full bg-white border border-stone-200 rounded-2xl pl-9 pr-4 py-2 text-xs text-stone-800 focus:outline-none focus:border-stone-400 shadow-sm">
                    </div>
                    <button onclick="handleOpenAddModal()" class="bg-stone-800 text-white text-xs font-medium px-4 py-2.5 rounded-2xl shadow-sm hover:bg-stone-700 transition-all flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>キャラ追加</span>
                    </button>
                </div>
            </div>
            <div id="characterGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- 📂 キャラクター詳細ビュー -->
        <div id="view-detail" class="hidden"></div>
    </main>

    <!-- 📝 キャラクター登録モーダル -->
    <div id="characterModal" class="hidden fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-stone-200 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-stone-100">
                <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-stone-600"></i>
                    <span>新規キャラクター登録</span>
                </h3>
                <button onclick="closeCharacterModal()" class="text-stone-400 hover:text-stone-700 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="characterForm" onsubmit="saveCharacter(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">TRPGシステム</label>
                    <select id="charSystemSelect" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                        <option value="coc">クトゥルフ神話TRPG</option>
                        <option value="sw25">ソード・ワールド2.5</option>
                        <option value="insane">インセイン</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">キャラクター名 <span class="text-rose-500">*</span></label>
                    <input type="text" id="charName" required placeholder="例：探索者 太郎" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-stone-600 mb-1">年齢</label>
                        <input type="number" id="charAge" placeholder="例：25" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-600 mb-1">職業 / クラス</label>
                        <input type="text" id="charOccupation" placeholder="例：私立探偵" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">アイコン画像URL（正方形サムネイル用）</label>
                    <input type="text" id="charThumbnail" placeholder="https://..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">立ち絵画像URL（メイン・通常）</label>
                    <input type="text" id="charAvatar" placeholder="https://..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                </div>
                <div class="pt-3 flex items-center justify-end gap-2">
                    <button type="button" onclick="closeCharacterModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-stone-600 hover:bg-stone-100 transition-all">キャンセル</button>
                    <button type="submit" class="bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-medium shadow-sm hover:bg-stone-700 transition-all">登録する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ⚙️ サイト設定モーダル -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-stone-200">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-stone-100">
                <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-gear text-stone-600"></i>
                    <span>キャラクター管理 サイト設定</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-stone-400 hover:text-stone-700 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form onsubmit="saveRosterSettings(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">ページタイトル</label>
                    <input type="text" id="settingTitleInput" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none focus:border-stone-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">ファビコン画像（ファイルアップロード）</label>
                    <div class="flex items-center gap-3">
                        <input type="file" id="settingFaviconFile" accept="image/*" onchange="handleFaviconFileSelect(event)" class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200 cursor-pointer">
                    </div>
                    <div class="mt-2 flex items-center gap-2">
                        <span class="text-[10px] text-stone-400">現在のアイコンプレビュー:</span>
                        <img id="settingFaviconPreview" class="w-8 h-8 rounded-lg object-cover border border-stone-200 hidden">
                    </div>
                </div>
                <div class="pt-3 flex items-center justify-end gap-2">
                    <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-stone-600 hover:bg-stone-100 transition-all">キャンセル</button>
                    <button type="submit" class="bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-medium shadow-sm hover:bg-stone-700 transition-all">設定を保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🔑 パスコード入力モーダル -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl border border-stone-200 scale-95 transition-transform duration-200 flex flex-col gap-4">
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-stone-50 text-stone-600 flex items-center justify-center mx-auto text-xl mb-2">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h3 class="text-base font-bold text-stone-800">管理者ログイン</h3>
                <p class="text-xs text-stone-500 mt-1">キャラクターの追加や設定変更を行うにはパスコードを入力してください。</p>
            </div>

            <form onsubmit="handleAuthSubmit(event)" class="flex flex-col gap-3">
                <div>
                    <input type="password" id="inputPasscode" placeholder="パスコードを入力" autocomplete="new-password" required class="w-full px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-center text-sm focus:outline-none focus:ring-2 focus:ring-stone-500/20 focus:border-stone-500 transition-all">
                    <p id="authErrorMsg" class="hidden text-[11px] text-rose-500 text-center mt-1">パスコードが違います。</p>
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <button type="button" onclick="closeAuthModal()" class="flex-1 py-2 text-xs font-medium text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">キャンセル</button>
                    <button type="submit" class="flex-1 py-2 text-xs font-medium text-white bg-stone-700 hover:bg-stone-800 rounded-xl transition-colors shadow-sm">認証する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- フッター -->
    <footer class="text-center py-6 text-[11px] text-stone-400 border-t border-stone-100 mt-12">
        <p>© Session Log Character Roster</p>
    </footer>

</body>
</html>
