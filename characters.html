        // HTMLエスケープ処理
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>""]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                }[match];
            });
        }
        window.escapeHtml = escapeHtml;
       
        // 🔒 ネタバレパーサー（||で囲まれた部分を目隠しにする。複数行対応）

            if (!text) return '';

            });

            (c.name && c.name.toLowerCase().includes(keyword)) ||
            (c.epithet && c.epithet.toLowerCase().includes(keyword)) ||

// 💡 完成版: キャラクター一覧描画関数（スマート二つ名＆自動コントラスト対応）
// ==========================================
function renderCharacterList(systemId, filterKeyword = "") {
    window.selectedSystemId = systemId;
    const sys = window.systems.find(s => s.id === systemId);
    const titleEl = document.getElementById('currentSystemTitle');
    if (titleEl && sys) titleEl.textContent = sys.name;

    const grid = document.getElementById('characterGrid');
    if (!grid) return;

    grid.innerHTML = '';
    const keyword = filterKeyword.toLowerCase().trim();
    const systemChars = window.characters.filter(c => c.systemId === systemId);
    
    const filteredChars = systemChars.filter(c => {
        if (!keyword) return true;
        const nameMatch = c.name && c.name.toLowerCase().includes(keyword);
        const epithetMatch = c.epithet && c.epithet.toLowerCase().includes(keyword);
        const occMatch = c.occupation && c.occupation.toLowerCase().includes(keyword);
        const ageMatch = c.age && String(c.age).includes(keyword);
        const birthdateMatch = c.birthdate && String(c.birthdate).toLowerCase().includes(keyword);
        return nameMatch || epithetMatch || occMatch || ageMatch || birthdateMatch;
    });

    if (filteredChars.length === 0) {
        grid.innerHTML = `
            <div class="col-span-full text-center py-12 text-stone-400 text-xs">
                <i class="fa-solid fa-user-slash text-2xl mb-2"></i>
                <p>${systemChars.length === 0 ? 'このシステムに登録されているキャラクターはまだいません。' : '条件に一致するキャラクターがいません。'}</p>

    filteredChars.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-3xl p-4 border border-stone-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col gap-3 relative overflow-hidden group';

            thumbHtml = `<img src="${ch.thumbnail}" class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-500">`;

            thumbHtml = `<img src="${ch.avatar}" class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-500">`;
        }

// ==========================================
// 💡 二つ名と読み仮名を崩れないよう上下にスッキリ配置
// ==========================================
let epithetHtml = '';
if (ch.epithet && ch.epithet.trim() !== '') {
    const kana = ch.epithetKana ? `<span class="text-[8px] font-normal text-stone-400 block">${ch.epithetKana}</span>` : '';
    epithetHtml = `
        <div class="mb-[-2px] truncate"> <!-- 💡 ここを mb-0.5 から mb-[-2px] などにして隙間を詰める -->
            ${kana}
            <span class="text-[11px] font-bold tracking-wider" style="color: ${themeColor}">${ch.epithet}</span>
        </div>
    `;
}

// 年齢と誕生日のテキスト組み立て（太字にはせず通常の太さ）
let ageAndBirthText = '';
if (ch.age) ageAndBirthText += `${ch.age}歳`;
if (ch.birthdate) {

card.innerHTML = `

`;
        grid.appendChild(card);

}

// 💡 画面やビューを切り替えるルーター関数（一本化・整理版）
// ==========================================
function navigateTo(target, param) {
    console.log("navigateTo called -> target:", target, "param:", param);

    // 0. モーダルが開いていれば全部閉じる（戻るときに閉じ忘れを防ぐ）
    const modals = ['characterModal', 'characterDetailModal'];
    modals.forEach(modalId => {
        const m = document.getElementById(modalId);
        if (m) m.classList.add('hidden');
    });

    // 💡 0.5. 【追加】トップ画面（ホーム・システム一覧）へ戻る場合
    if (target === 'home' || !target) {
        const folderView = document.getElementById('systemFolderView') || document.getElementById('view-folders');
        const listView = document.getElementById('characterListView') || document.getElementById('view-list') || document.getElementById('characterListContainer');
        const detailView = document.getElementById('view-detail');
        const systemSelectView = document.getElementById('systemSelectView');

        if (folderView) folderView.classList.remove('hidden');
        if (systemSelectView) systemSelectView.classList.remove('hidden');
        if (listView) listView.classList.add('hidden');
        if (detailView) detailView.classList.add('hidden');
    }
    // 1. システムごとの「キャラクター一覧画面」へ移動する場合
    else if (target === 'characterList') {
        // param（システムID）が渡されなかった場合は、現在選択中のものを維持
        const targetSystemId = param || window.selectedSystemId;
        window.selectedSystemId = targetSystemId;

        if (targetSystemId && typeof renderCharacterList === 'function') {
            renderCharacterList(targetSystemId);
        }

        // 各ビューの表示・非表示を切り替え
        const folderView = document.getElementById('systemFolderView') || document.getElementById('view-folders');
        const listView = document.getElementById('characterListView') || document.getElementById('view-list') || document.getElementById('characterListContainer');
        const detailView = document.getElementById('view-detail');
        const systemSelectView = document.getElementById('systemSelectView');

        if (folderView) folderView.classList.add('hidden');
        if (systemSelectView) systemSelectView.classList.add('hidden');
        if (listView) listView.classList.remove('hidden');
        if (detailView) detailView.classList.add('hidden');
    } 
    // 2. 個別の「キャラクター詳細画面」へ移動する場合
    else if (target === 'detail') {
        if (typeof renderCharacterDetail === 'function') {
            renderCharacterDetail(param);
        }

        const folderView = document.getElementById('systemFolderView') || document.getElementById('view-folders');
        const listView = document.getElementById('characterListView') || document.getElementById('view-list') || document.getElementById('characterListContainer');
        const detailView = document.getElementById('view-detail');
        const systemSelectView = document.getElementById('systemSelectView');

        if (folderView) folderView.classList.add('hidden');
        if (systemSelectView) systemSelectView.classList.add('hidden');
        if (listView) listView.classList.add('hidden');
        if (detailView) detailView.classList.remove('hidden');
    }

    // 3. ページの一番上にスクロールを戻す
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.navigateTo = navigateTo;

// 💡 カラー調整・文字色判定のヘルパー関数（先に追加する）
// ==========================================
function getAdjustedColor(hexColor) {
    if (!hexColor || !hexColor.startsWith('#')) return '#44403c';
    let r = parseInt(hexColor.slice(1, 3), 16);
    let g = parseInt(hexColor.slice(3, 5), 16);
    let b = parseInt(hexColor.slice(5, 7), 16);
    let yiq = (r * 299 + g * 587 + b * 114) / 1000;
    if (yiq > 200) {
        r = Math.floor(r * 0.7);
        g = Math.floor(g * 0.7);
        b = Math.floor(b * 0.7);
        return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }
    return hexColor;
}
window.getAdjustedColor = getAdjustedColor;

function getAdaptiveTextColor(hexColor) {
    if (!hexColor || !hexColor.startsWith('#')) return '#1c1917';
    let hex = hexColor.replace('#', '');
    if (hex.length === 3) {
        hex = hex.split('').map(char => char + char).join('');
    }
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 150 ? '#292524' : '#ffffff';
}
window.getAdaptiveTextColor = getAdaptiveTextColor;

function renderCharacterDetail(characterId) {
    const detailContainer = document.getElementById('view-detail');

    if (!ch) {

    }

    const rawThemeColor = ch.themeColor || '#292524';

    }

    // 二つ名と名前の間の無駄な改行・隙間をスッキリ圧縮

        <div>
            ${nameKanaHtml}

// 🍞 トースト通知・確認モーダルヘルパー
function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    const bgClass = type === 'error' ? 'bg-rose-800 text-white' : 'bg-stone-800 text-white';
    toast.className = `${bgClass} px-4 py-2.5 rounded-2xl text-xs shadow-lg flex items-center gap-2 animate-bounce transition-all`;
    toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function showConfirm(title, message, onYes) {
    const modal = document.getElementById('confirmModal');
    const titleEl = document.getElementById('confirmTitle');
    const descEl = document.getElementById('confirmDesc');
    const yesBtn = document.getElementById('confirmYesBtn');
    if (titleEl) titleEl.textContent = title;
    if (descEl) descEl.textContent = message;
    
    const newYesBtn = yesBtn.cloneNode(true);
    yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
    newYesBtn.onclick = () => {
        closeConfirmModal();
        onYes();
    };
    if (modal) {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        modal.querySelector('div').classList.remove('scale-95');
        modal.querySelector('div').classList.add('scale-100');
    }
}
window.closeConfirmModal = function() {
    const modal = document.getElementById('confirmModal');
    if (modal) {
        modal.classList.add('opacity-0', 'pointer-events-none');
        modal.querySelector('div').classList.remove('scale-100');
        modal.querySelector('div').classList.add('scale-95');
    }
};

// 💡 完全修正版: キャラクター保存関数（リアルタイム詳細更新対応版）
// ==========================================
async function saveCharacter(event) {
    event.preventDefault();
    const systemId = document.getElementById('charSystemSelect').value;
    
    // 基本情報の取得
    const name = document.getElementById('charName')?.value?.trim() || '';
    const nameKana = document.getElementById('charNameKana')?.value?.trim() || '';
    const epithet = document.getElementById('charEpithet')?.value?.trim() || '';
    const epithetKana = document.getElementById('charEpithetKana')?.value?.trim() || '';
    const age = document.getElementById('charAge')?.value;
    
    // 性別と誕生日の取得
    const gender = document.getElementById('charGender')?.value?.trim() || '';
    const birthdate = document.getElementById('charBirthdate')?.value?.trim() || '';
    
    const occupation = document.getElementById('charOccupation')?.value?.trim() || '';
    const themeColor = document.getElementById('charThemeColor')?.value || '#292524';
    const sheetUrl = document.getElementById('charSheetUrl')?.value?.trim() || '';
    
    const thumbnail = window.currentThumbnailBase64 || "";
    const avatar = window.currentAvatarBase64 || "";

    // カスタム項目の値（ステータス・テキスト）を正しく収集
    const customValues = {};

    // ステータス入力値の取得
    document.querySelectorAll('.char-custom-status-input').forEach(inputEl => {
        const inputId = inputEl.id; // 例: custom_status_abc123
        if (inputId && inputId.startsWith('custom_status_')) {
            const fieldId = inputId.replace('custom_status_', '');
            customValues[fieldId] = inputEl.value ? Number(inputEl.value) : '';
        }
    });

    // テキスト入力値の取得
    document.querySelectorAll('.char-custom-text-input').forEach(inputEl => {
        const inputId = inputEl.id; // 例: custom_text_xyz789
        if (inputId && inputId.startsWith('custom_text_')) {
            const fieldId = inputId.replace('custom_text_', '');
            customValues[fieldId] = inputEl.value;
        }
    });

    if (!name) { 
        alert("キャラクター名は必須です。"); 
        return; 
    }

    // 保存するデータオブジェクト
    const charData = {
        systemId, 
        name, 
        nameKana, 
        epithet, 
        epithetKana,
        age: age ? Number(age) : '',
        gender,      
        birthdate,   
        occupation, 
        themeColor,  
        sheetUrl, 
        thumbnail, 
        avatar,
        customValues,
        updatedAt: new Date().toISOString()
    };

    try {
        const charsRef = collection(db, 'artifacts', window.appId, 'public', 'data', 'characters');

        if (window.editingCharacterId) {
            // 📝 編集（更新）の場合
            const docRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'characters', window.editingCharacterId);
            await updateDoc(docRef, charData);

            // ローカルの配列を更新
            const index = window.characters.findIndex(c => c.id === window.editingCharacterId);
            if (index !== -1) {
                window.characters[index] = { id: window.editingCharacterId, ...window.characters[index], ...charData };
            }

            // 💡 【追加】もし現在「詳細画面」を表示中なら、その場で詳細画面を再描画してパッと最新状態にする！
            if (window.currentView === 'detail' && window.selectedCharacterId === window.editingCharacterId) {
                renderCharacterDetail(window.editingCharacterId);
            }

            showToast("キャラクターを更新しました！", "info");
        } else {
            // 🆕 新規作成の場合
            charData.createdAt = new Date().toISOString();
            const docRef = await addDoc(charsRef, charData);
            window.characters.push({ id: docRef.id, ...charData });
            showToast("キャラクターを登録しました！", "info");
        }

        closeCharacterModal();
        renderCharacterList(systemId);
        if (typeof renderSystemFolders === 'function') renderSystemFolders();
    } catch (e) {
        console.error("Save error:", e);
        alert("保存に失敗しました。画像サイズが大きすぎないか確認してください。");
    }
}
window.saveCharacter = saveCharacter;

function renderCharacterModalSystemSelect() {
    const select = document.getElementById('charSystemSelect');
    if (!select || !window.systems) return;

    const currentVal = select.value;
    select.innerHTML = '';
    
    // window.systems（定義済みのシステムリスト）からoptionを生成
    window.systems.forEach(sys => {
        const opt = document.createElement('option');
        opt.value = sys.id;
        opt.textContent = sys.name;
        select.appendChild(opt);
    });

    if (currentVal) {
        select.value = currentVal;
    }
    
    // 選択されたシステムに応じたカスタム項目欄を更新
    handleSystemChangeInModal();
}

// 💡 2. モーダル内でシステムが変更された時に動的項目を描画する関数（警告完全対策版）
// ==========================================
function handleSystemChangeInModal(existingCustomValues = {}) {
    const select = document.getElementById('charSystemSelect');
    const container = document.getElementById('dynamicCustomFieldsContainer');
    if (!select || !container) return;

    const systemId = select.value;
    container.innerHTML = '';

    const fields = window.systemCustomFields?.[systemId];
    if (!fields) return;

    // A. ステータス項目（数値入力など）の生成
    if (fields.status && fields.status.length > 0) {
        const statusWrapper = document.createElement('div');
        statusWrapper.className = 'space-y-2';
        statusWrapper.innerHTML = `<label class="block text-xs font-bold text-stone-700">ステータス設定</label>`;
        
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 gap-2';

        fields.status.forEach(st => {
            const div = document.createElement('div');
            const inputId = `custom_status_${st.id}`;
            const savedVal = existingCustomValues[st.id] !== undefined ? existingCustomValues[st.id] : '';

            // 💡 ラベルの中にinputを内包（ネスト）させることで、警告を100%防止します
            div.innerHTML = `
                <label class="block text-[10px] font-bold text-stone-600 mb-0.5" for="${inputId}">
                    ${st.label} (max: ${st.max || '-'})
                    <input type="number" 
                           id="${inputId}" 
                           name="${inputId}" 
                           value="${savedVal}" 
                           placeholder="0" 
                           class="char-custom-status-input w-full mt-1 bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 text-xs text-stone-800 font-normal focus:outline-none focus:border-stone-400">
                </label>
            `;
            grid.appendChild(div);
        });
        statusWrapper.appendChild(grid);
        container.appendChild(statusWrapper);
    }

    // B. テキスト項目（メモなど）の生成
    if (fields.text && fields.text.length > 0) {
        const textWrapper = document.createElement('div');
        textWrapper.className = 'space-y-2 mt-2';
        textWrapper.innerHTML = `<label class="block text-xs font-bold text-stone-700">カスタムテキスト項目</label>`;

        fields.text.forEach(tx => {
            const div = document.createElement('div');
            const inputId = `custom_text_${tx.id}`;
            const savedVal = existingCustomValues[tx.id] !== undefined ? existingCustomValues[tx.id] : '';

            // 💡 こちらも同様にネストさせて警告を防止
            div.innerHTML = `
                <label class="block text-[10px] font-bold text-stone-600 mb-0.5" for="${inputId}">
                    ${tx.label}
                    <textarea id="${inputId}" 
                              name="${inputId}" 
                              placeholder="入力してください" 
                              rows="2" 
                              class="char-custom-text-input w-full mt-1 bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 text-xs text-stone-800 font-normal focus:outline-none focus:border-stone-400">${savedVal}</textarea>
                </label>
            `;
            textWrapper.appendChild(div);
        });
        container.appendChild(textWrapper);
    }
}

       // 1. 一覧用アイコン画像のファイル選択時＆自動圧縮処理（透過維持・PNG形式）
function handleThumbnailFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            // アイコン用は最大 200px に制限
            const MAX_SIZE = 200;
            if (width > height) {
                if (width > MAX_SIZE) {
                    height *= MAX_SIZE / width;
                    width = MAX_SIZE;
                }
            } else {
                if (height > MAX_SIZE) {
                    width *= MAX_SIZE / height;
                    height = MAX_SIZE;
                }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // 💡 透過情報をクリアして保持
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            // 💡 PNG形式で出力（背景が黒くならない）
            const compressedBase64 = canvas.toDataURL('image/png');
            window.currentThumbnailBase64 = compressedBase64;

            // プレビュー表示
            const preview = document.getElementById('thumbPreview');
            if (preview) {
                preview.src = compressedBase64;
                preview.classList.remove('hidden');
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
window.handleThumbnailFileSelect = handleThumbnailFileSelect;


// 2. 立ち絵画像のファイル選択時＆自動圧縮処理（透過維持・PNG形式）
function handleAvatarFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            // 立ち絵は最大 800px に制限（Firestoreの1MB制限をクリアするため）
            const MAX_SIZE = 800;
            if (width > height) {
                if (width > MAX_SIZE) {
                    height *= MAX_SIZE / width;
                    width = MAX_SIZE;
                }
            } else {
                if (height > MAX_SIZE) {
                    width *= MAX_SIZE / height;
                    height = MAX_SIZE;
                }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // 💡 透過情報をクリアして保持
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            // 💡 PNG形式で出力（背景が黒くならない）
            const compressedBase64 = canvas.toDataURL('image/png');
            window.currentAvatarBase64 = compressedBase64;

            // プレビュー表示
            const preview = document.getElementById('avatarPreview');
            if (preview) {
                preview.src = compressedBase64;
                preview.classList.remove('hidden');
            }
            
            console.log("立ち絵圧縮完了(透過維持・PNG):", Math.round(compressedBase64.length / 1024), "KB");
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}
window.handleAvatarFileSelect = handleAvatarFileSelect;

// 💡 キャラクターを削除する関数
// ==========================================
function deleteCharacter(characterId) {
    // 削除の確認ダイアログ
    if (!confirm('本当にこのキャラクターを削除しますか？')) {
        return;
    }

    // 文字列・数値を揃えて該当キャラクターを配列から除外
    window.characters = window.characters.filter(c => String(c.id) !== String(characterId));

    // ローカルストレージ等に保存する関数があればここで呼ぶ（例: saveCharactersToStorage()）
    if (typeof saveCharactersToStorage === 'function') {
        saveCharactersToStorage();
    }

    // 詳細画面が開いていた場合は閉じるか、一覧へ戻す
    if (typeof goToTopPage === 'function') {
        goToTopPage();
    } else if (typeof renderCharacterList === 'function') {
        renderCharacterList();
    }

    // 削除成功のトースト通知
    if (typeof showToast === 'function') {
        showToast('キャラクターを削除しました', 'success');
    }
}
// 🌟 忘れずに window に登録する！
window.deleteCharacter = deleteCharacter;

        // 💡 設定を画面に適用する関数

        function applyRosterSettings(settings) {
            if (!settings) return;
            window.rosterSettings = settings; // データを保持

            // 1. 画面上のサイトタイトルを反映
            const siteHeaderTitle = document.getElementById('siteHeaderTitle');
            if (siteHeaderTitle && settings.title) {
                siteHeaderTitle.textContent = settings.title;
            }

            // 2. ヘッダー左側のアイコン画像を反映
            const faviconImgEl = document.getElementById('headerFaviconImg');
            if (faviconImgEl) {
                if (settings.favicon && settings.favicon.trim() !== '') {
                    faviconImgEl.src = settings.favicon;
                    faviconImgEl.classList.remove('hidden'); // 画像を表示
                } else {
                    faviconImgEl.classList.add('hidden');    // 画像を隠す
                }
            }

            // 3. ブラウザ自体のタブアイコン（ファビコン）の反映
            if (settings.favicon) {
                const faviconEl = document.getElementById('faviconIcon') || document.getElementById('dynamicFavicon') || document.querySelector("link[rel*='icon']");
                if (faviconEl) faviconEl.href = settings.favicon;

                const appleIconEl = document.getElementById('appleTouchIcon');
                if (appleIconEl) appleIconEl.href = settings.favicon;
            }
        }
        window.applyRosterSettings = applyRosterSettings;

        // 🔑 パスコード送信（認証・新規設定）の処理
function handleAuthSubmit(e) {
    e.preventDefault(); // フォームのデフォルト送信を防ぐ
    const passInput = document.getElementById('inputPasscode');
    const err = document.getElementById('authErrorMsg');
    const enteredPass = passInput ? passInput.value : '';

    // 1. 【初回】パスコードがまだ設定されていない場合（初期設定）
    if (!window.storedPasscode) {
        if (!enteredPass) return;
        window.storedPasscode = enteredPass;
        // 必要であればローカルストレージ等に保存する処理をここに記述
        // localStorage.setItem('appStoredPasscode', enteredPass);

        // 管理者状態にする
        window.isAdmin = true;
        sessionStorage.setItem('isAdminSession', 'true');

        closeAuthModal();
        updateAdminUI(); // 💡 これにより鍵アイコンと「PC追加」ボタンが一発で切り替わる！
        
        if (typeof showToast === 'function') {
            showToast('パスコードを設定し、ログインしました', 'success');
        }
        return;
    }

    // 2. 【通常】すでに設定されているパスコードと照合する場合
    if (enteredPass === window.storedPasscode) {
        if (err) err.classList.add('hidden');
        
        // 管理者状態にする
        window.isAdmin = true;
        sessionStorage.setItem('isAdminSession', 'true');

        closeAuthModal();
        updateAdminUI(); // 💡 ログイン成功時に鍵とPC追加ボタンを反映！

        if (typeof showToast === 'function') {
            showToast('管理者としてログインしました', 'success');
        }
    } else {
        // パスコードが間違っている場合
        if (err) err.classList.remove('hidden');
        if (passInput) {
            passInput.value = '';
            passInput.focus();
        }
    }
}
window.handleAuthSubmit = handleAuthSubmit;

                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">設定 / メモ</label>
                    <textarea id="charMemo" rows="3" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-800 focus:outline-none focus:border-stone-400" placeholder="キャラクターの設定や自由なメモを記入..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-rose-600 mb-1">秘匿メモ（ネタバレ）</label>
                    <textarea id="charSecret" rows="3" class="w-full bg-rose-50/40 border border-rose-200/70 rounded-xl p-2.5 text-xs text-stone-800 focus:outline-none focus:border-rose-400" placeholder="||ネタバレを含む秘匿テキストはこう書けます||"></textarea>
                </div>
            </div>

            <div id="dynamicCustomFieldsContainer" class="space-y-3 pt-2 border-t border-stone-100"></div>

            <div class="pt-2 border-t border-stone-100">
                <label for="thumbFile" class="block text-xs font-bold text-stone-600 mb-1">一覧用アイコン画像（自動圧縮）</label>
                <input type="file" id="thumbFile" accept="image/*" onchange="handleThumbnailFileSelect(event)" class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200 cursor-pointer">
                <div class="mt-2 flex items-center gap-2">
                    <span class="text-[10px] text-stone-400">プレビュー:</span>
                    <img id="thumbPreview" class="w-10 h-10 rounded-lg object-cover border border-stone-200 hidden">
                </div>
            </div>

            <div>
                <label for="avatarFile" class="block text-xs font-bold text-stone-600 mb-1">立ち絵画像（大サイズPNG対応）</label>
                <input type="file" id="avatarFile" accept="image/*" onchange="handleAvatarFileSelect(event)" class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200 cursor-pointer">
                <div class="mt-2 flex items-center gap-2">
                    <span class="text-[10px] text-stone-400">プレビュー:</span>
                    <img id="avatarPreview" class="w-12 h-16 rounded-lg object-contain border border-stone-200 hidden">
                </div>
            </div>

            <div class="pt-3 flex items-center justify-end gap-2">
                <button type="button" onclick="closeCharacterModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-stone-600 hover:bg-stone-100 transition-all">キャンセル</button>
                <button type="submit" class="bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-medium shadow-sm hover:bg-stone-700 transition-all">登録する</button>
            </div>
        </form>
    </div>
</div>

    <!-- 🔑 パスコード入力モーダル -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl border border-stone-200 scale-95 transition-transform duration-200 flex flex-col gap-4">
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-stone-50 text-stone-600 flex items-center justify-center mx-auto text-xl mb-2">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h3 id="authModalTitle" class="text-base font-bold text-stone-800">管理者ログイン</h3>
                <p id="authModalDesc" class="text-xs text-stone-500 mt-1">キャラクターの追加や設定変更をするにはパスコードが必要です。</p>
            </div>

            <form onsubmit="handleAuthSubmit(event)" class="flex flex-col gap-3">
    <!-- 💡 ブラウザの警告を消すための隠しユーザー名フィールド -->
    <input type="text" name="username" autocomplete="username" class="hidden" style="display:none;" />

    <div>
        <!-- 💡 autocomplete="new-password" を current-password に変更 -->
        <input type="password" id="inputPasscode" placeholder="パスコードを入力" autocomplete="current-password" required class="w-full px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-center text-sm focus:outline-none focus:ring-2 focus:ring-stone-500/20 focus:border-stone-500 transition-all">
        <p id="authErrorMsg" class="hidden text-[11px] text-rose-500 text-center mt-1">パスコードが違います。</p>
    </div>
    <div class="flex items-center gap-2 mt-2">
        <button type="button" onclick="closeAuthModal()" class="flex-1 py-2 text-xs font-medium text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">キャンセル</button>
        <button type="submit" class="flex-1 py-2 text-xs font-medium text-white bg-stone-700 hover:bg-stone-800 rounded-xl transition-colors shadow-sm">認証する</button>
    </div>
</form>
        </div>
    </div>

    <!-- ❓ 確認モーダル -->
    <div id="confirmModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl border border-stone-200 scale-95 transition-transform duration-200 flex flex-col gap-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 flex items-center justify-center mx-auto text-xl mb-1">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <div>
                <h3 id="confirmTitle" class="text-base font-bold text-stone-800">確認</h3>
                <p id="confirmDesc" class="text-xs text-stone-500 mt-1">本当によろしいですか？</p>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <button type="button" onclick="closeConfirmModal()" class="flex-1 py-2 text-xs font-medium text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">いいえ</button>
                <button type="button" id="confirmYesBtn" class="flex-1 py-2 text-xs font-medium text-white bg-amber-700 hover:bg-amber-800 rounded-xl transition-colors shadow-sm">はい</button>
            </div>
        </div>
    </div>

    <!-- 🍞 トースト通知コンテナ -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- フッター -->
    <footer class="text-center py-6 text-[11px] text-stone-400 border-t border-stone-100 mt-12">
        <p>© Character log</p>
    </footer>
</body>
</html>
