<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター管理 | 卓日記</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fcfbf9;
            color: #292524;
        }
        .font-serif-title {
            font-family: 'Playfair Display', 'Noto Sans JP', serif;
        }
        input[type="text"], input[type="number"], select, textarea {
            font-size: 16px !important;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.addEventListener("DOMContentLoaded", async () => {
            console.log("🚀 キャラクター管理ページ初期化開始...");

            // 1. 管理者セッションの復元
            try {
                if (sessionStorage.getItem('isAdminSession') === 'true') {
                    window.isAdmin = true;
                }
            } catch (e) { console.error(e); }

            window.appId = "photo-journal-app";

            const firebaseConfig = {
                apiKey: "AIzaSyA2ctX9sUpJmLSVJomU9cbMzrUX_AXNjuE",
                authDomain: "diary-36d77.firebaseapp.com",
                projectId: "diary-36d77",
                storageBucket: "diary-36d77.firebasestorage.app",
                messagingSenderId: "1060563209082",
                appId: "1:1060563209082:web:1c6cfc21a496548309e4c3",
                measurementId: "G-RBK7ZN6NF1"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            window.db = db;

            await signInAnonymously(auth);
            console.log("🔑 キャラクター管理: 匿名認証成功");

            // サンプルのシステム一覧データ（後でFirestore管理に拡張可能）
            window.systems = [
                { id: 'coc', name: 'クトゥルフ神話TRPG', desc: 'CoC 6版 / 7版', badgeColor: 'bg-amber-900/80' },
                { id: 'sw25', name: 'ソード・ワールド2.5', desc: 'SW2.5 ルールブック', badgeColor: 'bg-emerald-800/80' },
                { id: 'insane', name: 'インセイン', desc: 'マルチジャンルホラーRPG', badgeColor: 'bg-purple-900/80' }
            ];

            // サンプルキャラクターデータ（後でFirestoreから取得）
            window.characters = [
                { id: 'c1', systemId: 'coc', name: '探索者 太郎', age: 25, occupation: '私立探偵', thumbnail: '', avatar: '' },
                { id: 'c2', systemId: 'coc', name: '九条 院子', age: 22, occupation: '大学生', thumbnail: '', avatar: '' },
                { id: 'c3', systemId: 'sw25', name: 'レイヴン', age: 16, occupation: 'グラップラー', thumbnail: '', avatar: '' }
            ];

            // 初期画面（1階層目：システム別フォルダ）を描画
            renderSystemFolders();
            updateAdminStateDisplay();
        });

        // 🌟 1階層目：システムフォルダ一覧の描画
        function renderSystemFolders() {
            const container = document.getElementById('systemFoldersContainer');
            if (!container) return;

            container.innerHTML = '';
            window.systems.forEach(sys => {
                // 該当システムのキャラ数をカウント
                const count = window.characters.filter(c => c.systemId === sys.id).length;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 border border-stone-200/80 shadow-sm hover:border-stone-400 transition-all cursor-pointer flex flex-col justify-between gap-4 group';
                card.onclick = () => navigateTo('characterList', sys.id);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-medium text-white px-2.5 py-1 rounded-lg ${sys.badgeColor}">${sys.desc}</span>
                            <i class="fa-solid fa-folder-open text-stone-300 group-hover:text-stone-600 transition-colors"></i>
                        </div>
                        <h3 class="font-bold text-base text-stone-800 group-hover:text-stone-900">${sys.name}</h3>
                        <p class="text-xs text-stone-400 mt-1">登録キャラクター: <span class="font-bold text-stone-600">${count}</span> 名</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-stone-100 text-xs text-stone-500 font-medium">
                        <span>一覧を見る</span>
                        <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 🌟 2階層目：キャラクター一覧の描画
        function renderCharacterList(systemId) {
            window.selectedSystemId = systemId;
            const sys = window.systems.find(s => s.id === systemId);
            const titleEl = document.getElementById('currentSystemTitle');
            if (titleEl && sys) titleEl.textContent = sys.name;

            const grid = document.getElementById('characterGrid');
            if (!grid) return;

            grid.innerHTML = '';
            const filteredChars = window.characters.filter(c => c.systemId === systemId);

            if (filteredChars.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-stone-400 text-xs">
                        <i class="fa-solid fa-user-slash text-2xl mb-2"></i>
                        <p>このシステムに登録されているキャラクターはまだいません。</p>
                    </div>
                `;
                return;
            }

            filteredChars.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 border border-stone-200/80 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col gap-3';
                card.onclick = () => navigateTo('detail', ch.id);

                // サムネイルの判定（専用がなければアイコン、あれば表示）
                let thumbHtml = `<div class="w-full h-full flex items-center justify-center text-stone-300 bg-stone-50"><i class="fa-solid fa-user text-3xl"></i></div>`;
                if (ch.thumbnail) {
                    thumbHtml = `<img src="${ch.thumbnail}" class="w-full h-full object-cover">`;
                }

                card.innerHTML = `
                    <div class="aspect-[3/4] w-full rounded-xl overflow-hidden relative border border-stone-100">
                        ${thumbHtml}
                    </div>
                    <div>
                        <h4 class="font-bold text-sm text-stone-800">${ch.name}</h4>
                        <p class="text-xs text-stone-400 mt-0.5">${ch.age ? ch.age + '歳' : ''} ${ch.occupation || ''}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 🔀 ルーター関数（画面の切り替えとパンくず管理）
        function navigateTo(view, param = null) {
            const viewFolders = document.getElementById('view-folders');
            const viewList = document.getElementById('view-list');
            const viewDetail = document.getElementById('view-detail');
            const breadcrumbs = document.getElementById('breadcrumbs');

            if (viewFolders) viewFolders.classList.add('hidden');
            if (viewList) viewList.classList.add('hidden');
            if (viewDetail) viewDetail.classList.add('hidden');

            if (view === 'folders') {
                if (viewFolders) viewFolders.classList.remove('hidden');
                if (breadcrumbs) {
                    breadcrumbs.innerHTML = `<span class="text-stone-700 font-medium flex items-center gap-1"><i class="fa-solid fa-house text-[10px]"></i> システム一覧</span>`;
                }
                renderSystemFolders();
            } else if (view === 'characterList') {
                if (viewList) viewList.classList.remove('hidden');
                const sys = window.systems.find(s => s.id === param);
                const sysName = sys ? sys.name : 'キャラクター一覧';
                if (breadcrumbs) {
                    breadcrumbs.innerHTML = `
                        <a href="javascript:void(0)" onclick="navigateTo('folders')" class="hover:text-stone-900 transition-colors flex items-center gap-1"><i class="fa-solid fa-house text-[10px]"></i> システム一覧</a>
                        <span class="text-stone-300">/</span>
                        <span class="text-stone-700 font-medium">${sysName}</span>
                    `;
                }
                renderCharacterList(param);
            } else if (view === 'detail') {
                if (viewDetail) viewDetail.classList.remove('hidden');
                // 3階層目（詳細）は次のステップで本格実装します！
                alert('次は3階層目（キャラクター詳細・差分ビューア）を実装します！選択ID: ' + param);
            }
        }
        window.navigateTo = navigateTo;

        function updateAdminStateDisplay() {
            const badge = document.getElementById('adminStateBadge');
            if (badge && window.isAdmin) badge.classList.remove('hidden');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200/80 px-4 py-3.5">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-1.5 text-xs text-stone-600 hover:text-stone-900 bg-stone-100 hover:bg-stone-200/70 px-3 py-1.5 rounded-xl transition-all">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>日記へ</span>
                </a>
                <h1 class="text-base font-bold font-serif-title text-stone-800 flex items-center gap-2">
                    <i class="fa-solid fa-users text-stone-600 text-xs"></i>
                    <span>Character Roster</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="adminStateBadge" class="hidden text-[10px] font-medium bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md">
                    管理者モード
                </span>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto w-full p-4 flex-1">
        
        <!-- パンくずリスト -->
        <nav id="breadcrumbs" class="flex items-center gap-2 text-xs text-stone-400 mb-6">
            <span class="text-stone-700 font-medium flex items-center gap-1">
                <i class="fa-solid fa-house text-[10px]"></i> システム一覧
            </span>
        </nav>

        <!-- 📂 【1階層目】システム別フォルダビュー -->
        <div id="view-folders">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-lg font-bold text-stone-800">システム選択</h2>
                    <p class="text-xs text-stone-400">管理したいTRPGシステムを選んでください</p>
                </div>
            </div>
            <div id="systemFoldersContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- 動的生成 -->
            </div>
        </div>

        <!-- 📂 【2階層目】キャラクター一覧ビュー -->
        <div id="view-list" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 id="currentSystemTitle" class="text-lg font-bold text-stone-800">キャラクター一覧</h2>
                    <p class="text-xs text-stone-400">登録されている探索者・NPC</p>
                </div>
                <!-- 新規作成ボタン（管理者用などの拡張用） -->
                <button onclick="alert('新規キャラクター登録モーダルを次に作ります！')" class="bg-stone-800 text-white text-xs font-medium px-4 py-2.5 rounded-2xl shadow-sm hover:bg-stone-700 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>キャラ追加</span>
                </button>
            </div>
            <div id="characterGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- 動的生成 -->
            </div>
        </div>

        <!-- 📂 【3階層目】詳細ビュー（準備中） -->
        <div id="view-detail" class="hidden">
            <!-- 次のステップで実装 -->
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center py-6 text-[11px] text-stone-400 border-t border-stone-100 mt-12">
        <p>© Session Log Character Roster</p>
    </footer>

</body>
</html>
